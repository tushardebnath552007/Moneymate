services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneymate
      POSTGRES_PASSWORD: moneymate
      POSTGRES_DB: moneymate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://moneymate:moneymate@db:5432/moneymate
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --port=3000 --host=0.0.0.0"
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
